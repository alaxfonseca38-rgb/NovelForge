[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelforge-agent"
version = "0.3.0"
description = "Persistent multi-agent long-form fiction workspace inspired by agentic novel-generation architectures."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "NovelForge contributors"}]
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
novelforge = "novelforge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
